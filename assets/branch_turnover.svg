<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title { font: 600 17px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #24292f; }
    .lbl   { font: 500 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; }
    .val   { font: 600 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #24292f; }
    .bar   { fill: #0969da; }
    .bar:hover { fill: #8250df; }
    .sub   { font: 400 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #6e7781; }
  </style>
  <text x="20" y="28" class="title">Branch turnover (average-inventory basis, 2019–2024)</text>
  <text x="20" y="46" class="sub">Stock is similar at every branch; sales are not. Overall 0.14x.</text>
  
  <text x="98" y="80" text-anchor="end" class="lbl">HYD001</text>
  <rect x="110" y="60" width="308.0" height="28" rx="5" class="bar">
    <title>HYD001: turnover 0.11x</title>
    <animate attributeName="width" from="0" to="308.0" dur="1.1s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="426.0" y="80" class="val" opacity="0">0.11x
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.00s" fill="freeze"/>
  </text>
  <text x="98" y="122" text-anchor="end" class="lbl">PUN001</text>
  <rect x="110" y="102" width="336.0" height="28" rx="5" class="bar">
    <title>PUN001: turnover 0.12x</title>
    <animate attributeName="width" from="0" to="336.0" dur="1.1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="454.0" y="122" class="val" opacity="0">0.12x
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.15s" fill="freeze"/>
  </text>
  <text x="98" y="164" text-anchor="end" class="lbl">DEL001</text>
  <rect x="110" y="144" width="364.0" height="28" rx="5" class="bar">
    <title>DEL001: turnover 0.13x</title>
    <animate attributeName="width" from="0" to="364.0" dur="1.1s" begin="0.30s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="482.0" y="164" class="val" opacity="0">0.13x
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.30s" fill="freeze"/>
  </text>
  <text x="98" y="206" text-anchor="end" class="lbl">AHM001</text>
  <rect x="110" y="186" width="420.0" height="28" rx="5" class="bar">
    <title>AHM001: turnover 0.15x</title>
    <animate attributeName="width" from="0" to="420.0" dur="1.1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="538.0" y="206" class="val" opacity="0">0.15x
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.45s" fill="freeze"/>
  </text>
  <text x="98" y="248" text-anchor="end" class="lbl">KOL001</text>
  <rect x="110" y="228" width="476.0" height="28" rx="5" class="bar">
    <title>KOL001: turnover 0.17x</title>
    <animate attributeName="width" from="0" to="476.0" dur="1.1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="594.0" y="248" class="val" opacity="0">0.17x
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.60s" fill="freeze"/>
  </text>
  <text x="98" y="290" text-anchor="end" class="lbl">CHN001</text>
  <rect x="110" y="270" width="476.0" height="28" rx="5" class="bar">
    <title>CHN001: turnover 0.17x</title>
    <animate attributeName="width" from="0" to="476.0" dur="1.1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="594.0" y="290" class="val" opacity="0">0.17x
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.75s" fill="freeze"/>
  </text>
  <line x1="502.0" y1="52" x2="502.0" y2="306" stroke="#cf222e" stroke-dasharray="4 4" stroke-width="1.5">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
  </line>
  <text x="506.0" y="318" class="sub" fill="#cf222e">overall 0.14x</text>
</svg>
