<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title { font: 600 17px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #24292f; }
    .lbl   { font: 500 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #57606a; }
    .val   { font: 600 13px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #24292f; }
    .sub   { font: 400 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #6e7781; }
    rect:hover { opacity: 0.8; }
  </style>
  <text x="20" y="28" class="title">Stock on hand by age (approximate)</text>
  <text x="20" y="46" class="sub">81% of stock value is over a year old. Shares are estimates until ledger ordering is confirmed.</text>
  <line x1="60" y1="280" x2="720" y2="280" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="90" y="280" width="78" height="0" rx="6" fill="#0969da">
    <title>0–30 days: 1.1% of stock value (approx.)</title>
    <animate attributeName="y" from="280" to="277.5" dur="1s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <animate attributeName="height" from="0" to="2.5" dur="1s" begin="0.00s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="129" y="269.5" text-anchor="middle" class="val" opacity="0">1.1%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.90s" fill="freeze"/>
  </text>
  <text x="129" y="302" text-anchor="middle" class="lbl">0–30</text>
  <rect x="220" y="280" width="78" height="0" rx="6" fill="#0969da">
    <title>31–90 days: 3.3% of stock value (approx.)</title>
    <animate attributeName="y" from="280" to="272.4" dur="1s" begin="0.20s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <animate attributeName="height" from="0" to="7.6" dur="1s" begin="0.20s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="259" y="264.4" text-anchor="middle" class="val" opacity="0">3.3%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.10s" fill="freeze"/>
  </text>
  <text x="259" y="302" text-anchor="middle" class="lbl">31–90</text>
  <rect x="350" y="280" width="78" height="0" rx="6" fill="#0969da">
    <title>91–180 days: 4.6% of stock value (approx.)</title>
    <animate attributeName="y" from="280" to="269.4" dur="1s" begin="0.40s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <animate attributeName="height" from="0" to="10.6" dur="1s" begin="0.40s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="389" y="261.4" text-anchor="middle" class="val" opacity="0">4.6%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.30s" fill="freeze"/>
  </text>
  <text x="389" y="302" text-anchor="middle" class="lbl">91–180</text>
  <rect x="480" y="280" width="78" height="0" rx="6" fill="#0969da">
    <title>181–365 days: 9.8% of stock value (approx.)</title>
    <animate attributeName="y" from="280" to="257.5" dur="1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <animate attributeName="height" from="0" to="22.5" dur="1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="519" y="249.5" text-anchor="middle" class="val" opacity="0">9.8%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.50s" fill="freeze"/>
  </text>
  <text x="519" y="302" text-anchor="middle" class="lbl">181–365</text>
  <rect x="610" y="280" width="78" height="0" rx="6" fill="#cf222e">
    <title>>365 days: 81.1% of stock value (approx.)</title>
    <animate attributeName="y" from="280" to="93.5" dur="1s" begin="0.80s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    <animate attributeName="height" from="0" to="186.5" dur="1s" begin="0.80s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="649" y="85.5" text-anchor="middle" class="val" opacity="0">81.1%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.70s" fill="freeze"/>
  </text>
  <text x="649" y="302" text-anchor="middle" class="lbl">>365</text>
</svg>
